<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Matrices - Versión Local</title>
    <style>
      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(135deg, #ffeef8 0%, #ffd1eb 100%);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        color: #5a3d4a;
        padding: 40px;
      }

      h2 {
        color: #d63384;
        text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.1);
      }

      /* Contenedor principal estilo 'Glass' */
      .glass-panel {
        background: rgba(255, 255, 255, 0.4);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.6);
        border-radius: 20px;
        padding: 30px;
        box-shadow: 0 8px 32px rgba(214, 51, 132, 0.1);
        text-align: center;
      }

      /* Inputs de filas/columnas */
      input[type="number"] {
        border: 2px solid #ffc2e0;
        border-radius: 10px;
        padding: 8px;
        outline: none;
        transition: all 0.3s;
        text-align: center;
      }

      input[type="number"]:focus {
        border-color: #d63384;
        box-shadow: 0 0 8px rgba(214, 51, 132, 0.2);
      }

      /* Botones con estilo */
      button {
        background-color: #ff85c1;
        color: white;
        border: none;
        padding: 10px 20px;
        border-radius: 12px;
        cursor: pointer;
        font-weight: 600;
        transition:
          transform 0.2s,
          background 0.3s;
        margin: 5px;
      }

      button:hover {
        background-color: #f06292;
        transform: translateY(-2px);
      }

      /* Diseño de las matrices */
      .matrix-container {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 30px;
        margin-top: 20px;
      }

      .matrix-card {
        background: rgba(255, 255, 255, 0.6);
        padding: 15px;
        border-radius: 15px;
        border: 1px solid #ffdeef;
      }

      /* Celdas de las matrices */
      .m1,
      .m2 {
        width: 45px;
        height: 45px;
        margin: 3px;
        font-size: 14px;
      }

      .result-box {
        margin-top: 25px;
        padding: 20px;
        background: #fff0f6;
        border-left: 5px solid #ff85c1;
        border-radius: 10px;
        font-family: "Courier New", Courier, monospace;
      }
    </style>
  </head>
  <body>
    <h2>Operaciones con Matrices en local</h2>

    <div>
      <input type="number" id="filas" placeholder="Filas" />
      <input type="number" id="columnas" placeholder="Columnas" />
      <button onclick="dibujarMatrices()">Dibujar Matrices</button>
    </div>

    <div class="matrix-container" id="contenedor-matrices"></div>

    <div id="controles" style="display: none">
      <button onclick="operar('sumar')">Sumar</button>
      <button onclick="operar('multiplicar')">Multiplicar</button>
    </div>

    <div id="resultado" class="result"></div>

    <script src="script.js"></script>
  </body>
</html>
