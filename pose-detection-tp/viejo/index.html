<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Detección de Pose - MediaPipe</title>

    <script
      src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js"
      crossorigin="anonymous"
    ></script>

    <style>
      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        margin: 0;
        background: linear-gradient(135deg, #121212 0%, #2a1b2e 100%);
        color: #ffffff;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      }

      .glass-container {
        background: rgba(255, 255, 255, 0.05);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid rgba(255, 105, 180, 0.2);
        border-radius: 24px;
        padding: 2rem;
        box-shadow: 0 8px 32px 0 rgba(255, 105, 180, 0.15);
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      h2 {
        margin-top: 0;
        color: #ffb6c1;
        letter-spacing: 1px;
      }

      #status {
        color: #ff69b4;
        font-weight: 500;
        margin-bottom: 1.5rem;
      }

      .video-wrapper {
        position: relative;
        width: 640px;
        height: 480px;
        border-radius: 16px;
        overflow: hidden;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
      }

      /* Ocultamos el video real, solo queremos ver el canvas que dibujamos encima */
      #input_video {
        display: none;
      }

      #output_canvas {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div class="glass-container">
      <h2>Detección de Pose (MediaPipe)</h2>
      <p id="status">Cargando la magia visual... dame un segundo.</p>

      <div class="video-wrapper">
        <video id="input_video" autoplay playsinline></video>
        <canvas id="output_canvas" width="640" height="480"></canvas>
      </div>
    </div>

    <script src="main.js"></script>
  </body>
</html>
