<!doctype html>
<html>
  <head>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@3.0.0/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/mobilenet@1.0.0/dist/mobilenet.min.js"></script>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Barlow+Condensed:wght@400;600;700&display=swap");

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        background: #060809;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }

      .detector-root {
        font-family: "Barlow Condensed", sans-serif;
        background: #0a0c0f;
        width: 100%;
        max-width: 860px;
        padding: 24px;
        border-radius: 12px;
        color: #e8e4d0;
        position: relative;
        overflow: hidden;
        border: 1px solid #1a2030;
      }

      .detector-root::before {
        content: "";
        position: absolute;
        inset: 0;
        background: repeating-linear-gradient(
          0deg,
          transparent,
          transparent 28px,
          rgba(255, 255, 255, 0.02) 28px,
          rgba(255, 255, 255, 0.02) 29px
        );
        pointer-events: none;
      }

      .hud-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        border-bottom: 1px solid #2a3040;
        padding-bottom: 14px;
        margin-bottom: 20px;
      }

      .hud-title {
        font-family: "Share Tech Mono", monospace;
        font-size: 11px;
        color: #4a7c59;
        letter-spacing: 3px;
        text-transform: uppercase;
      }

      .hud-id {
        font-family: "Share Tech Mono", monospace;
        font-size: 10px;
        color: #3a4a5a;
        letter-spacing: 2px;
      }

      .blink {
        display: inline-block;
        width: 8px;
        height: 8px;
        background: #4a7c59;
        border-radius: 50%;
        margin-right: 8px;
        animation: blink 1.4s step-end infinite;
      }

      @keyframes blink {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.1;
        }
      }

      .main-grid {
        display: grid;
        grid-template-columns: 1fr 200px;
        gap: 16px;
        align-items: start;
      }

      .image-zone {
        position: relative;
        background: #0d1117;
        border: 1px solid #1e2a38;
        border-radius: 6px;
        overflow: hidden;
        aspect-ratio: 16/10;
      }

      .image-zone img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
        filter: contrast(1.05) saturate(0.9);
      }

      .scan-line {
        position: absolute;
        left: 0;
        right: 0;
        height: 2px;
        background: linear-gradient(90deg, transparent, #4a7c59, transparent);
        animation: scan 2.8s linear infinite;
        opacity: 0.7;
      }

      @keyframes scan {
        0% {
          top: -2px;
        }
        100% {
          top: 100%;
        }
      }

      .corner {
        position: absolute;
        width: 14px;
        height: 14px;
        border-color: #4a7c59;
        border-style: solid;
        opacity: 0.7;
      }
      .corner.tl {
        top: 8px;
        left: 8px;
        border-width: 2px 0 0 2px;
      }
      .corner.tr {
        top: 8px;
        right: 8px;
        border-width: 2px 2px 0 0;
      }
      .corner.bl {
        bottom: 8px;
        left: 8px;
        border-width: 0 0 2px 2px;
      }
      .corner.br {
        bottom: 8px;
        right: 8px;
        border-width: 0 2px 2px 0;
      }

      .img-label {
        position: absolute;
        bottom: 10px;
        left: 12px;
        font-family: "Share Tech Mono", monospace;
        font-size: 10px;
        color: #4a7c59;
        letter-spacing: 1.5px;
        opacity: 0.8;
      }

      .side-panel {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .panel-box {
        background: #0d1117;
        border: 1px solid #1e2a38;
        border-radius: 6px;
        padding: 14px;
      }

      .panel-label {
        font-family: "Share Tech Mono", monospace;
        font-size: 9px;
        color: #3a4a5a;
        letter-spacing: 2px;
        text-transform: uppercase;
        margin-bottom: 8px;
      }

      .status-display {
        font-family: "Share Tech Mono", monospace;
        font-size: 22px;
        font-weight: 700;
        letter-spacing: 1px;
        transition:
          color 0.4s,
          text-shadow 0.4s;
      }

      .status-display.idle {
        color: #3a4a5a;
      }
      .status-display.scanning {
        color: #4a7c59;
      }
      .status-display.detected {
        color: #d4a843;
        text-shadow: 0 0 12px rgba(212, 168, 67, 0.4);
      }
      .status-display.clear {
        color: #4a7c59;
      }

      .confidence-bar {
        margin-top: 10px;
      }

      .conf-track {
        background: #1a1f28;
        border-radius: 2px;
        height: 6px;
        overflow: hidden;
        border: 1px solid #1e2a38;
      }

      .conf-fill {
        height: 100%;
        background: #4a7c59;
        border-radius: 2px;
        width: 0%;
        transition:
          width 0.8s ease,
          background 0.4s;
      }

      .conf-fill.high {
        background: #d4a843;
      }

      .conf-value {
        font-family: "Share Tech Mono", monospace;
        font-size: 10px;
        color: #4a6070;
        margin-top: 5px;
        letter-spacing: 1px;
      }

      .detect-btn {
        width: 100%;
        background: transparent;
        border: 1px solid #2a3a4a;
        color: #4a7c59;
        font-family: "Share Tech Mono", monospace;
        font-size: 11px;
        letter-spacing: 2px;
        padding: 12px;
        border-radius: 4px;
        cursor: pointer;
        text-transform: uppercase;
        transition: all 0.2s;
      }

      .detect-btn:hover {
        border-color: #4a7c59;
        background: rgba(74, 124, 89, 0.08);
        color: #6aac79;
      }

      .detect-btn:active {
        opacity: 0.7;
      }

      .log-box {
        background: #0d1117;
        border: 1px solid #1e2a38;
        border-radius: 6px;
        padding: 12px;
        margin-top: 16px;
      }

      .log-entries {
        font-family: "Share Tech Mono", monospace;
        font-size: 10px;
        color: #3a4a5a;
        letter-spacing: 0.5px;
        line-height: 1.9;
        min-height: 48px;
      }

      .log-entries .log-line {
        display: flex;
        gap: 10px;
      }
      .log-entries .log-time {
        color: #2a3540;
      }
      .log-entries .log-msg {
        color: #3a5040;
      }
      .log-entries .log-msg.alert {
        color: #d4a843;
      }
      .log-entries .log-msg.ok {
        color: #4a7c59;
      }

      .alert-flash {
        position: absolute;
        inset: 0;
        background: rgba(212, 168, 67, 0.07);
        pointer-events: none;
        opacity: 0;
        border-radius: 6px;
        transition: opacity 0.3s;
      }

      .alert-flash.show {
        opacity: 1;
        animation: flashpulse 0.6s ease;
      }

      @keyframes flashpulse {
        0% {
          opacity: 0;
        }
        20% {
          opacity: 1;
        }
        100% {
          opacity: 0;
        }
      }
    </style>
  </head>
  <body>
    <div class="detector-root">
      <div class="hud-header">
        <div class="hud-title">
          <span class="blink"></span>Vehicle Detection System
        </div>
        <div class="hud-id">UNIT #VDS-04 &nbsp;|&nbsp; CAM-01</div>
      </div>

      <div class="main-grid">
        <div class="image-zone">
          <img id="myImage" src="truck.jpg" alt="Target image" />
          <div class="scan-line"></div>
          <div class="corner tl"></div>
          <div class="corner tr"></div>
          <div class="corner bl"></div>
          <div class="corner br"></div>
          <div class="img-label" id="imgLabel">FEED LIVE</div>
          <div class="alert-flash" id="alertFlash"></div>
        </div>

        <div class="side-panel">
          <div class="panel-box">
            <div class="panel-label">Status</div>
            <div class="status-display idle" id="statusDisplay">STANDBY</div>
            <div class="confidence-bar">
              <div class="conf-track">
                <div class="conf-fill" id="confFill"></div>
              </div>
              <div class="conf-value" id="confValue">CONFIDENCE: —</div>
            </div>
          </div>

          <div class="panel-box">
            <div class="panel-label">Top detections</div>
            <div
              style="
                font-family: &quot;Share Tech Mono&quot;, monospace;
                font-size: 11px;
                color: #3a4a5a;
                line-height: 1.8;
              "
              id="topClass"
            >
              —<br />—<br />—
            </div>
          </div>

          <button class="detect-btn" id="detectBtn" onclick="runDetection()">
            [ ANALYZE ]
          </button>
        </div>
      </div>

      <div class="log-box">
        <div class="panel-label">Event log</div>
        <div class="log-entries" id="logEntries">
          <div class="log-line">
            <span class="log-time">00:00:00</span>
            <span class="log-msg">System initialized. Awaiting trigger.</span>
          </div>
        </div>
      </div>
    </div>

    <script>
      let model = null;
      let logLines = [
        { t: "00:00:00", m: "System initialized. Awaiting trigger.", cls: "" },
      ];

      function ts() {
        const n = new Date();
        return [n.getHours(), n.getMinutes(), n.getSeconds()]
          .map((x) => String(x).padStart(2, "0"))
          .join(":");
      }

      function addLog(msg, cls = "") {
        logLines.push({ t: ts(), m: msg, cls });
        if (logLines.length > 5) logLines.shift();
        document.getElementById("logEntries").innerHTML = logLines
          .map(
            (l) =>
              `<div class="log-line"><span class="log-time">${l.t}</span><span class="log-msg ${l.cls}">${l.m}</span></div>`,
          )
          .join("");
      }

      function setStatus(text, cls) {
        const el = document.getElementById("statusDisplay");
        el.textContent = text;
        el.className = "status-display " + cls;
      }

      function setConf(val, cls = "") {
        const fill = document.getElementById("confFill");
        fill.style.width = val + "%";
        fill.className = "conf-fill " + cls;
        document.getElementById("confValue").textContent =
          "CONFIDENCE: " + (val > 0 ? val.toFixed(0) + "%" : "—");
      }

      async function runDetection() {
        const btn = document.getElementById("detectBtn");
        btn.disabled = true;
        btn.textContent = "[ SCANNING... ]";
        setStatus("SCANNING", "scanning");
        addLog("Analysis initiated...");

        if (!model) {
          addLog("Loading neural model...");
          try {
            model = await mobilenet.load();
            addLog("Model ready.", "ok");
          } catch (e) {
            addLog("Model load failed.", "alert");
            setStatus("ERROR", "idle");
            btn.disabled = false;
            btn.textContent = "[ ANALYZE ]";
            return;
          }
        }

        try {
          const predictions = await model.classify(
            document.getElementById("myImage"),
          );
          const top = predictions[0];
          const foundTruck = predictions.some((p) =>
            p.className.toLowerCase().includes("truck"),
          );
          const topConf = Math.round(top.probability * 100);

          document.getElementById("topClass").innerHTML = predictions
            .slice(0, 3)
            .map((p) => p.className.split(",")[0].toUpperCase().slice(0, 22))
            .join("<br>");

          if (foundTruck) {
            setStatus("DETECTED", "detected");
            setConf(topConf, "high");
            addLog(
              "TRUCK DETECTED — " + top.className.split(",")[0].toUpperCase(),
              "alert",
            );
            const flash = document.getElementById("alertFlash");
            flash.classList.add("show");
            setTimeout(() => flash.classList.remove("show"), 700);
            document.getElementById("imgLabel").textContent = "! TRUCK ALERT";
            document.getElementById("imgLabel").style.color = "#d4a843";
          } else {
            setStatus("CLEAR", "clear");
            setConf(topConf, "");
            addLog("No truck. Top: " + top.className.split(",")[0], "ok");
            document.getElementById("imgLabel").textContent = "FEED LIVE";
            document.getElementById("imgLabel").style.color = "";
          }
        } catch (e) {
          addLog("Analysis error.", "alert");
          setStatus("ERROR", "idle");
        }

        btn.disabled = false;
        btn.textContent = "[ ANALYZE ]";
      }
    </script>
  </body>
</html>
